concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  PREVIEW_ENV_FRONTEND_DOMAIN: pr-${{ github.event.number }}.preview.${{ secrets.DOMAIN_PRODUCTION }}

jobs:
  porter-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: vars
        name: Set Github tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Setup porter
        uses: porter-dev/setup-porter@v0.1.0
      - env:
          PORTER_APP_NAME: pylon-proxy-backend
          PORTER_CLUSTER: "4359"
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: "13871"
          PORTER_PR_NUMBER: ${{ github.event.number }}
          PORTER_REPO_NAME: ${{ github.event.repository.name }}
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
          PORTER_TOKEN: ${{ secrets.PORTER_APP_13871_4359 }}
        name: Build and deploy preview environment for the backend
        run: exec porter apply -f ./backend/porter.yaml --preview
        timeout-minutes: 30
      - env:
          CLOUDFLARE_API_EMAIL: ${{ secrets.CLOUDFLARE_API_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        id: create_record
        name: Create DNS Record
        uses: marcelofcandido/yet-another-cloudflare-action@v1
        with:
          proxy: false
          record: ${{ env.PREVIEW_ENV_FRONTEND_DOMAIN }}
          target: ${{ secrets.CLUSTER_INGRESS_DOMAIN }}
          ttl: 3600
          type: CNAME
          zone_name: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
      - name: Turn PR branch name non-alphanumeric characters into hyphens
        id: remove_non_alphanumeric
        run: |
          output=${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]'
          echo $output
          echo "formatted_branch_name=$output" >> $GITHUB_OUTPUT
      - name: Porter Replace Action
        uses: porter-dev/replace-action@v0.1.0
        with:
          file_path: ./frontend/frontend.porter.yaml
          key_values: "$$DOMAIN_NAME=${{ env.PREVIEW_ENV_FRONTEND_DOMAIN }},$$PROXY_INTERNAL=http://pylon-proxy-backend-api.${{ steps.remove_non_alphanumeric.outputs.formatted_branch_name }}.svc.cluster.local:8080"
      - env:
          PORTER_APP_NAME: pylon-proxy-frontend
          PORTER_CLUSTER: "4359"
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: "13871"
          PORTER_PR_NUMBER: ${{ github.event.number }}
          PORTER_REPO_NAME: ${{ github.event.repository.name }}
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
          PORTER_TOKEN: ${{ secrets.PORTER_APP_13871_4359 }}
        name: Build and deploy preview environment for the frontend
        run: exec porter apply -f ./frontend.porter.yaml --preview
        timeout-minutes: 30

name: Deploy to Preview Environment

"on":
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "!.github/workflows/porter_**"
