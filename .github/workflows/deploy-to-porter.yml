concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  porter-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: vars
        name: Set Github tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Setup porter
        uses: porter-dev/setup-porter@v0.1.0
      - env:
          DOCKER_BUILDKIT: "1"
          PORTER_APP_NAME: pylon-proxy-backend
          PORTER_BUILDKIT_ARGS: --platform linux/arm64
          PORTER_BUILDKIT_PUSH_ARGS: --platform linux/arm64
          PORTER_CLUSTER: "5365"
          PORTER_DEPLOYMENT_TARGET_ID: 8345dd30-482a-4891-abbf-6a578f17265d
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: "13871"
          PORTER_PR_NUMBER: ${{ github.event.number }}
          PORTER_REPO_NAME: ${{ github.event.repository.name }}
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
          PORTER_TOKEN: ${{ secrets.PORTER_APP_13871_5365 }}
        name: Deploy backend
        run: exec porter apply -f ./backend/backend.porter.yaml
        timeout-minutes: 30
      - name: Porter Replace Action
        uses: porter-dev/replace-action@v0.1.0
        with:
          file_path: ./frontend/frontend.porter.yaml
          key_values: $$DOMAIN_NAME=${{ secrets.DOMAIN_PRODUCTION }}
      - env:
          DOCKER_BUILDKIT: "1"
          PORTER_APP_NAME: pylon-proxy-frontend
          PORTER_BUILDKIT_ARGS: --platform linux/arm64
          PORTER_BUILDKIT_PUSH_ARGS: --platform linux/arm64
          PORTER_CLUSTER: "5365"
          PORTER_DEPLOYMENT_TARGET_ID: 8345dd30-482a-4891-abbf-6a578f17265d
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: "13871"
          PORTER_PR_NUMBER: ${{ github.event.number }}
          PORTER_REPO_NAME: ${{ github.event.repository.name }}
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
          PORTER_TOKEN: ${{ secrets.PORTER_APP_13871_5365 }}
        name: Deploy frontend
        run: exec porter apply -f ./frontend/frontend.porter.yaml
        timeout-minutes: 30

name: Deploy to Pylon Proxy

"on":
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/deploy-to-porter.yml"
  workflow_dispatch: {}
